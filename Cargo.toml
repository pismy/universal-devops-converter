[package]
name = "universal-devops-converter"
version = "1.1.0"
edition = "2021"
rust-version = "1.82"
description = "Convert DevOps tool reports (coverage, tests, SAST, SBOM…) between equivalent formats."
license = "MIT"
repository = "https://github.com/pismy/universal-devops-converter"
readme = "README.md"
keywords = ["devops", "ci", "coverage", "sarif", "converter"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "udc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
jsonschema = { version = "0.53.0", default-features = false }
serde_json = "1"
