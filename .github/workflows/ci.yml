name: CI

# `main` is deliberately absent: a push there runs `release.yml`, which calls
# the same checks before publishing. Running both would verify every release
# commit twice, in parallel, for no added confidence.
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
