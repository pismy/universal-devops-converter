name: Verify

# Everything that decides whether a commit is sound, defined once.
#
# Called by `ci.yml` on branches and pull requests, and by `release.yml` before
# it publishes. It cannot be a workflow of its own that the others wait on:
# `needs` only orders jobs *within* a workflow, so two workflows triggered by
# the same push run in parallel — the release would start before the checks
# finished. A reusable workflow is what makes one definition serve both while
# keeping the ordering.
on:
  workflow_call:

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # `tests/conversion.rs` validates every XML report it writes against the
      # vendored DTD/XSD. Without xmllint that half of the suite would skip, so
      # `xmllint_is_available_in_ci` fails the build instead.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the install script
        run: shellcheck install.sh .github/scripts/update-floating-tags.sh
